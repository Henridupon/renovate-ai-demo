name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: mvn verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn verify
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Build-log bewaren voor de AI-fix
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          retention-days: 3
